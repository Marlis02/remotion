schema: project/1

id: vertical-v1
channelId: demo-channel

# ДЕМО-ПРОЕКТ `H-07`, А НЕ ФИКСТУРА. Разница названа вслух: `fixtures/minimal` — вход
# охранников (её нельзя трогать ни символом), а этот каталог — то, на что владелец СМОТРИТ
# глазами. Отсюда и содержимое: три настоящих фотографии public domain и настоящий
# вариативный шрифт вместо синтетических sha фикстуры.
#
# Геометрия времени и кадра — те же числа, что у фикстуры, и по тем же причинам:
# 30 fps — решение владельца 3 (RM2, 2026-08-22), 1080×1920 — вертикаль Shorts.
fps: { num: 30, den: 1 }
width: 1080
height: 1920

projectSampleRate: 24000

seedRoot: 305419896

profiles:
  compile: profiles/compile.yaml
  render: profiles/render.final.yaml
  draft: profiles/render.draft.yaml
  renderAc4: profiles/render.ac4.yaml
  audio: profiles/audio.yaml

# ЖИВОЙ ГОЛОС (`V-06`). Демо — не фикстура: правило **V9** («все фикстуры на `tts:mock@1`»)
# относится к `fixtures/`, и живой прогон делается ВНЕ его (roadmap §3, решение владельца 8).
# Отсюда и разница с фикстурой: здесь тайминг НАСТОЯЩИЙ — привязки слов приходят из
# `alignment` живого провайдера, а не из синтетического расписания мока.
#
# ЧТО ЭТО ЗНАЧИТ ДЛЯ СБОРКИ. Дубли уже оплачены и лежат в `voice/takes/` — пересборка их не
# трогает и в сеть не ходит (попадание `voiceKey`). Пересъёмка стоит денег и потому требует
# ДВУХ разрешений сразу: `--allow-tts` (**K8**) и `ELEVENLABS_LIVE=1` в командной строке
# (транспорт подаёт `bin/vpe.ts`; из файла `.env` этот флаг не берётся).
voice:
  providerId: "tts:elevenlabs@1"
  modelId: "eleven_multilingual_v2"
  voiceId: "ELEVENLABS_VOICE_ID"   # ИМЯ переменной окружения, не значение (CLAUDE.md §2)
  seed: 7
  binderId: "provider-timestamps@1"

# .store живёт ВНЕ дерева проекта (ADR-0005 §8a, M8) — тот же адрес, что у фикстуры.
store:
  path: "~/.vpe/store"
  remotes: ["local-dir"]
