  #
  # `z: 25` — НАД визуальными слоями (`kenburns@1` 10, `flash@1` 20) и ПОД субтитрами
  # (`captionEmphasis@1` 30, слой `#captions` — `z-index: 1000`). Решение владельца `E-07`:
  # вспышка ГРЕЙДИТСЯ вместе с кадром — она часть картинки, а не интерфейса; субтитры не
  # грейдятся никогда, и это охраняется пикселями (`grade-captions.test.ts`).
  #
  # `grain: 0` — ЦЕНА, А НЕ ВКУС. Зерно работает и воспроизводимо (гейт `final` N = 10 —
  # PASS), но стоит 411.5 мс/кадр и ×8.2 по диску: AC2 (60-сек Short ≤ 15 мин = 500 мс/кадр
  # на всю композицию) ломается им в одиночку. Измерение — `docs/impl/E-07/report.md` §5,
  # правило — решение владельца `E-07`. Поставить число обратно стоит одной правки здесь.
  - recordId: "a15d0b73"
    at: { kind: anchor, anchor: "sc:road" }
    until: { kind: anchor, anchor: "sc:road" }
    track: effect
    z: 25
    template: "grade@1"
    params:
      saturate: 0.85
      contrast: 1.08
      sepia: 0.28
      hueRotate: -6
      vignette: 0.35
      grain: 0

  - recordId: "0c9d64e2"
    at: { kind: anchor, anchor: "sc:road" }
    until: { kind: anchor, anchor: "sc:road" }
    track: caption
    z: 30
    template: "captionEmphasis@1"
    params:
