schema: direction/1

# Вся параметрика живёт здесь; проза остаётся прозой (ADR-0002).
# at/until — ТОЛЬКО якоря b:/sc:/ch:/r: (правило ADR-0004 §2, охраняется тестом A1).
#
# Записи для [img: …] здесь НЕ перечислены: их порождает компилятор (`expandImg`) как
# still@1 на z: 0 — от неявного бита b:img-<alias>-1 до следующего [img:] той же сцены
# либо до конца сцены. Именно поэтому окна kenburns@1 ниже написаны ТОЙ ЖЕ парой якорей:
# эффект двигает СОСЕДНИЙ СНИЗУ слой (`previousElementSibling`), и разъехавшиеся окна
# оставили бы его без цели.
#
# recordId — 4 случайных байта, как в фикстуре; вход seed'а (ADR-0007 §1).
#
# ПАРАЛЛАКС ЗДЕСЬ ОДИН, И ЭТО РЕШЕНИЕ (`E-02`, 2026-08-31). Сцена 2 («механик 1920») переведена
# на `parallax25@1` с двумя слоями; сцены 1 и 3 остаются на `kenburns@1`. Основание выбора
# ИМЕННО этой сцены — измерение, а не вкус: см. комментарий у записи `4d8ea15b`.
#
# ГРЕЙДА ЗДЕСЬ НЕТ, И ЭТО РЕШЕНИЕ, А НЕ ПРОПУСК (`ENV-01`, 2026-08-31). `E-07` поставил в
# каждую из трёх сцен клип `grade@1` с единым тоном канала; владелец посмотрел ролик и снял
# его — дословно: «тон незаметен, готовые изображения буду давать уже обработанными». Снят
# ТОЛЬКО вызов: шаблон `grade@1` остаётся в библиотеке шестым, его две записи гейта и два
# файла запроса — на месте, вернуть тон стоит одной записи здесь. Числа, которыми он был
# позван, и цена зерна — `docs/impl/E-07/report.md` §5.

records:
  # ── сцена 1: улица 1900 ─────────────────────────────────────────────────────
  - recordId: "1a7c0e33"
    at: { kind: anchor, anchor: "b:img-street-1" }
    until: { kind: anchor, anchor: "sc:street" }     # until на scope-якоре = его конец
    track: visual
    z: 10
    template: "kenburns@1"
    # ВЕРТИКАЛЬ БЕРЁТСЯ КАДРИРОВАНИЕМ, А НЕ РАСТЯЖЕНИЕМ (решение владельца `H-07`):
    # снимок горизонтальный 3840×2835, кадр 1080×1920. `still@1` кладёт его `cover`,
    # то есть по высоте, а Ken Burns ведёт по горизонтали — так виден сюжет, а не
    # растянутые лица. Ровно эти шесть чисел и есть пресет `drift-right` (`TPL-01b`):
    # он снят С ЭТОЙ записи и с её близнеца в `ai-test-1`, поэтому перекрывать нечего.
    preset: "drift-right"

  - recordId: "9f31b204"
    at: { kind: anchor, anchor: "sc:street" }
    until: { kind: anchor, anchor: "sc:street" }
    track: caption
    z: 30
    template: "captionEmphasis@1"
    preset: "bold"

  # ── сцена 2: механик 1920 ───────────────────────────────────────────────────
  - recordId: "4d8ea15b"
    at: { kind: anchor, anchor: "b:img-mechanic-1" }
    until: { kind: anchor, anchor: "sc:work" }
    track: visual
    z: 10
    # ~~`kenburns@1`: ход вниз-вверх по фигуре, наезд мягкий~~ *(изменено: `E-02`,
    # 2026-08-31.)* **ЭТА СЦЕНА — ЕДИНСТВЕННАЯ НА ПАРАЛЛАКСЕ, И СНИМОК ВЫБРАН ИЗМЕРЕНИЕМ.**
    # Задание `E-02` называло улицу 1900 (`street`); измерено (отчёт §7): инструмент класса
    # u2net сегментирует ОДИН выделенный объект, а на Mulberry Street толпа без такового —
    # три модели дали 0.1–0.2 % кадра, глазами не слой, а привидение. На этом снимке тот же
    # `u2net` даёт **46.6 %** и чистую вырезку: механик с насосом отделены от помещения.
    # Решение владельца 2026-08-31: демо-параллакс — здесь; улица остаётся на `kenburns@1`.
    #
    # ДВА СЛОЯ, И ДАЛЬНИЙ — САМ ОРИГИНАЛ. `mechanic` без альфы закрывает кадр целиком
    # (дыр не бывает по построению), `mechanic-figure` — вырезка с альфой поверх него.
    # Фон отдельным файлом потребовал бы дорисовки на месте вырезанного, которой на снимке
    # 1920 года не было. Права ближнего слоя читаются по `derivedFrom` от дальнего.
    template: "parallax25@1"
    # ~~Числа — предложение сессии под просмотр глазами, не измерение: `drift: 0.045`,
    # `depthSpread: 2.6`.~~ Числа правились ПОСЛЕ просмотра (`drift: 0.09`, `depthSpread: 3.2`),
    # и комментарий с прежними держался рядом с новыми до `TPL-01b`. Теперь и те и другие
    # живут пресетами: здесь стоит `figure-wide` (выраженный параллакс, снят С ЭТОЙ записи),
    # а прежние — `figure-soft`, снятый с `ai-test-1`. Alias'ы слоёв в пресете взяты отсюда же,
    # поэтому перекрывать их не нужно; порядок списка — от ДАЛЬНЕГО к ближнему.
    preset: "figure-wide"

  - recordId: "c2b70f89"
    at: { kind: anchor, anchor: "sc:work" }
    until: { kind: anchor, anchor: "sc:work" }
    track: caption
    z: 30
    template: "captionEmphasis@1"
    preset: "bold"

  # ── сцена 3: дорога 1936 ────────────────────────────────────────────────────
  - recordId: "6e05a7d1"
    at: { kind: anchor, anchor: "b:img-mother-1" }
    until: { kind: anchor, anchor: "sc:road" }
    track: visual
    z: 10
    template: "kenburns@1"
    # Диагональ с наездом почти от единицы — самый сдержанный ход трёх сцен; пресет
    # `diagonal-close` снят С ЭТОЙ записи (`TPL-01b`).
    preset: "diagonal-close"

  # Вспышка на бите `close` — единственное место, где ролик прибавляет голос. Слабая:
  # 22 % против 35 % у фикстуры. Демо показывает ТИПОГРАФИКУ и движение, и вспышка здесь
  # не эффект ради эффекта, а метка того самого слова, на котором стоит [emph].
  - recordId: "b8340c6a"
    at: { kind: anchor, anchor: "b:close" }
    track: effect
    z: 20
    template: "flash@1"
    # 22 % и 150 мс при 24000 — пресет `soft-accent`, снятый с этой записи и с её близнеца
    # в `ai-test-1` (обе режиссуры звали вспышку одинаково).
    preset: "soft-accent"

  - recordId: "0c9d64e2"
    at: { kind: anchor, anchor: "sc:road" }
    until: { kind: anchor, anchor: "sc:road" }
    track: caption
    z: 30
    template: "captionEmphasis@1"
    preset: "bold"
