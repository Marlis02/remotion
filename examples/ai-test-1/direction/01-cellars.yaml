schema: direction/1
records:
# Сцена street: горизонтальный снимок толпы — ведём по горизонтали (H-07),
# окно = окно порождённой записи [img: street].
-
  recordId: "a3f19c42"
  at:
    kind: anchor
    anchor: "b:img-street-1"
  until:
    kind: anchor
    anchor: "sc:street"
  track: visual
  z: 10
  template: "kenburns@1"
  # Те же шесть чисел, что стояли здесь до `TPL-01b`, — теперь под именем (`presets/drift-right.json`).
  preset: "drift-right"
-
  recordId: "5b7e0d18"
  at:
    kind: anchor
    anchor: "sc:street"
  until:
    kind: anchor
    anchor: "sc:street"
  track: caption
  z: 30
  template: "captionEmphasis@1"
  preset: "bold"
# Сцена work: одна выделенная фигура — настоящий параллакс на двух слоях,
# от дальнего (оригинал) к ближнему (вырезка). Окно = окно [img: mechanic].
-
  recordId: "c92a4e61"
  at:
    kind: anchor
    anchor: "b:img-mechanic-1"
  until:
    kind: anchor
    anchor: "sc:work"
  track: visual
  z: 10
  template: "parallax25@1"
  # Ход и глубина — из пресета; alias'ы слоёв у пресета взяты из ЭТОГО проекта, поэтому
  # перекрывать их нечем и не нужно (`presets/figure-soft.json`).
  preset: "figure-soft"
-
  recordId: "0e6d3b7f"
  at:
    kind: anchor
    anchor: "sc:work"
  until:
    kind: anchor
    anchor: "sc:work"
  track: caption
  z: 30
  template: "captionEmphasis@1"
  preset: "bold"
# Сцена road: портретный снимок — медленный наезд без горизонтального хода.
# Окно = окно [img: mother]. Вспышка одна на ролик — на слове «nobody»,
# ради которого написана сцена; until у flash@1 не нужен.
-
  recordId: "7d41a9c3"
  at:
    kind: anchor
    anchor: "b:img-mother-1"
  until:
    kind: anchor
    anchor: "sc:road"
  track: visual
  z: 10
  template: "kenburns@1"
  # Портретный снимок: только вертикаль (`presets/portrait-push-up.json`).
  preset: "portrait-push-up"
-
  recordId: "e18f52b0"
  at:
    kind: anchor
    anchor: "sc:road"
  until:
    kind: anchor
    anchor: "sc:road"
  track: caption
  z: 30
  template: "captionEmphasis@1"
  preset: "bold"
-
  recordId: "48c0e9a7"
  at:
    kind: anchor
    anchor: "b:evict"
  track: effect
  z: 20
  template: "flash@1"
  # 22 % и 150 мс — те же (`presets/soft-accent.json`).
  preset: "soft-accent"
# bed@1 не вызван: аудио-alias в списке владельца нет, выдумывать нельзя.
# grade@1 не вызван: в канале выключен (ENV-01).