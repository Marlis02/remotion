schema: voice-roles/1

# Пресеты ролей голоса — ADR-0010 §3a-bis, ADR-0005 §1b. Форма уточнена решением владельца
# (S-02, 2026-08-22): СПИСОК, а не карта (порядок канонический и диффится построчно);
# providerId на роль отсутствует — провайдер один на проект, из project.yaml.voice;
# modelId опционален — роль без него наследует project.yaml.voice.modelId.
#
# voice_id держит ИМЯ ПЕРЕМЕННОЙ ОКРУЖЕНИЯ, а не значение (CLAUDE.md §2, Charter §6).
# Здесь оно совпадает с project.yaml.voice.voiceId: демо ходит к живому провайдеру (`V-06`).
#
# Ссылки из режиссуры на эту роль в фикстуре НЕТ ни одной: запись direction/*.yaml с
# track: voice и полем voiceRole ставит задача A-02 (roadmap §3). До неё применимость роли —
# вход стадии plan (V-03), а не резолв записи.
#
# voice_settings пуст, и это не заглушка: настройки голоса демо не переопределяет, и пустой
# объект означает ровно это — «взято умолчание провайдера». Правка ЛЮБОГО поля внутри
# voice_settings обязана менять voiceKey затронутых чанков — инвариант V15, ADR-0006 §2,
# то есть непустое значение здесь стоит ПЕРЕСЪЁМКИ всех дублей роли.
roles:
  - roleId: "narrator"
    voice_id: "ELEVENLABS_VOICE_ID"
    voice_settings: {}
