schema: audio-profile/1

# deliverySampleRate: величина остаётся, ОБОСНОВАНИЕ снято (RM2, дрейф roadmap §9 п. 3).
# Прежняя строка ссылалась на «у Remotion по умолчанию 48000» — на снятого кандидата
# (решение владельца 1 серии SP-3). После V6 и ADR-0008 «Сборка» аудио кодирует ОДИН РАЗ
# наш ffmpeg при муксе финала, сегменты немые (R5), то есть рендерер на эту величину
# не влияет вовсе. Собственного основания в репозитории НЕТ:
# UNKNOWN — почему именно 48000, а не 24000 (= projectSampleRate, тогда ресемплинга нет).
# Где решается: SP-5 / задача X-02 (U7, U8 — детерминизм ресемплинга и A/V-сдвиг).
deliverySampleRate: 48000
codec: aac
bitrateKbps: 192

resampler:
  engine: soxr
  precision: 28
  # Ресемплинг музыки — ОДИН РАЗ на ingest, не на миксе (ADR-0010 §9):
  # тогда микс — сложение целых сэмплов, и версия ресемплера не влияет на выход сборки.

loudness:
  targetLufs: -14                 # целевая громкость: «публикуемый» обязан быть числом, а не словом
  truePeakDb: -1.0

crossfadeSamples: 72              # 3 мс при 24 кГц, внутри уже отведённого интервала (T7)

# Предел длины чанка в code points (ADR-0010 §3). Абзац длиннее делится по границам
# предложений ВНУТРИ себя, слева направо; бегущего счётчика по документу нет (V3).
# 600 — из просодии, стоимости перегенерации и гранулярности AC3, НЕ из качества alignment:
# FACT (SP-2b.5) предел по качеству alignment не найден до 2689 code points / 155.4 с.
# Пересмотр — по первому настоящему ролику (решение владельца, V-03, 2026-08-24).
maxChunkChars: 600

# Пороги приёмки дубля (ADR-0010 §1). Значения ИЗМЕРЕНЫ в SP-2 и внесены RM2
# (дрейф roadmap §9 п. 2); комментарий «уточняются в SP-2» снят — спайк выполнен.
# FACT (SP-2 findings U6 + SP-2b.5): на здоровом материале uniqueTimestampRatio = 1.000,
# maxEqualRun = 1 на ряду 202 → 403 → 810 → 1514 → 2689 code points / 155.4 с.
# Порог 0.9 лежит далеко от рабочей точки ⇒ ложных срабатываний не даёт.
# Порог maxEqualRun ≤ 8 безопасен; агрессивные 2 брать НЕЛЬЗЯ — сломались бы на эмодзи
# (FACT: 🚢 → ratio 0.976 при run 2; 👍🏽 → 0.956 при 3), а эмодзи в прозе линтом не запрещены.
takeAcceptance:
  minUniqueTimestampRatio: 0.9
  maxEqualRun: 8
  maxRetries: 2                   # после них — падение сборки, деления чанка НЕ происходит (M12)

# Акустический детектор границ речи T7 (ADR-0003 T7 после SP-2, решение владельца 1 SP-2).
# Внесён RM2 (дрейф roadmap §9 п. 4): константы обязаны где-то жить, и ADR-0003 «Риски»
# теперь называет это место явно.
# Метод менять нельзя — иначе числа несравнимы с измеренными (медиана лид-ина 95–100 мс,
# хвоста 296–310 мс на двух голосах). Обрезка — с ОБЕИХ сторон, по RMS, а не по таймкодам
# провайдера: FACT (SP-2 U4.3) start[0] = 0 на 56 строках из 56 при реальном лид-ине 95–100 мс.
#
# ВНИМАНИЕ, входит в правило: эти константы привязаны к ПАРЕ (голос, модель) и
# ИНВАЛИДИРУЮТСЯ при смене любого из двух (ADR-0003 «Риски» после SP-2).
speechEdges:
  windowSamples: 240              # 10 мс при projectSampleRate 24000
  thresholdDbFs: -45
  sides: both

# Заполняется калибровкой алигнера на tts:mock@1 (находка C6, ADR-0007 §9).
# Пока полка неизвестна, AC5-b измеряет сумму «ошибка провайдера ⊕ ошибка прибора»,
# и порог AC5-b НЕ ФОРМУЛИРУЕТСЯ (Charter AC5, долг SP-2 №2).
# Алигнер выбран решением владельца 2 (RM2, 2026-08-22): torchaudio MMS forced alignment.
# Фаза — ПОСЛЕ fixtures/reference (задача A-03).
# Версии Python-контура здесь НЕ пишутся: поле версии в схеме профиля запрещено
# инвариантом K6. Они пинятся в pip-локе и сверяются при прогоне AC5-b (ADR-0007 §9);
# в engineFingerprint рендера они не входят — это прибор AC5-b, а не рендер.
alignerId: "torchaudio-mms-fa@1"
alignerNoiseFloor:
  p50: null
  p95: null
  max: null

# Измеряется в SP-5 (фикстура «вспышка + щелчок»).
avOffsetCompensationSamples: 0
