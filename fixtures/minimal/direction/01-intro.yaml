schema: direction/1

# Вся параметрика живёт здесь; проза остаётся прозой (ADR-0002).
# at/until — ТОЛЬКО якоря b:/sc:/ch:/r:. Ссылок на w: здесь нет и быть не может
# (правило ADR-0004 §2, охраняется тестом A1 из docs/invariants.md).
#
# Записи для [img: …] здесь НЕ перечислены: их порождает компилятор,
# привязывая к неявным битам b:img-harbour-1, b:img-ledger-1, b:img-sea-1 (M1).
# recordId — 4 случайных байта, выданные CLI; вход seed'а (ADR-0007 §1).

records:
  - recordId: "a3f19c2b"
    at: { kind: anchor, anchor: "sc:intro" }
    until: { kind: anchor, anchor: "b:reveal" }
    track: visual
    z: 10
    template: "kenburns@1"
    params:
      from: { scale: 1.00, x: 0.0, y: 0.0 }
      to: { scale: 1.12, x: 0.03, y: -0.02 }
      # Приведено к реестру RM2 (2026-08-22, дрейф roadmap §9 п. 8). Прежнее имя
      # "inOutCubic" в реестре ОТСУТСТВУЕТ: ADR-0007 §3 после серии SP-3 уточнил реестр —
      # это ИМЕНОВАННЫЕ КРИВЫЕ GSAP (power1.inOut, power2.inOut, power3.out, back.out(1.7),
      # sine.inOut, none), в IR идут строка-идентификатор и числа, реализация — в
      # завендоренном gsap, версия которого входит в engineFingerprint (R14).
      # INFERENCE: cubic in-out у GSAP называется power2.inOut (power1 = quad, power2 = cubic).
      # Реестр фиксирует и ПОРЯДОК ТРАНСФОРМАЦИЙ (translate → scale у GSAP): на Ken Burns
      # это до 5.4 px на последнем кадре (FACT SP-3c §6.2 п. 3), поэтому кадры НЕ переносимы
      # на другой рендерер — кривая называется по имени рендерера, а не «по смыслу».
      easing: "power2.inOut"

  - recordId: "7b20de44"
    at: { kind: anchor, anchor: "b:reveal" }
    track: effect
    z: 20
    template: "flash@1"
    params:
      strengthPct: 35
      durationSamples: 4800       # Duration абсолютна и разрешена (V1 запрещает абсолютную
                                  # форму только у kind: anchor)

  - recordId: "c81a05f7"
    at: { kind: anchor, anchor: "sc:turn" }
    until: { kind: anchor, anchor: "ch:main" }      # until на scope-якоре = его конец
    track: music
    z: 0
    template: "bed@1"
    params:
      asset: "pad-loop"
      inPoint: { kind: mediaTime, asset: "pad-loop", offsetSamples: 96000 }
      gainDb: -18
      duckUnderSpeechDb: -6

  - recordId: "5d6e1130"
    at: { kind: anchor, anchor: "b:count" }
    track: visual
    z: 15
    template: "still@1"
    params:
      asset: "ledger"
      fit: cover

  - recordId: "e40b7a92"
    at: { kind: anchor, anchor: "b:close" }
    track: caption
    z: 30
    template: "captionEmphasis@1"
    params:
      style: "bold"
