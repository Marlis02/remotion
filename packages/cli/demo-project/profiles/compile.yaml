schema: compile-profile/1

# ЧАСТЬ ПРОИЗВЕДЕНИЯ. Только намерение человека — вычисляемых полей здесь нет (M9).
# 30 fps — РЕШЕНИЕ владельца 3 (RM2, 2026-08-22), не умолчание: ADR-0003,
# «fps = 30 — решение, а не умолчание». Смена на 60 — откат с пересъёмом гейта.
fps: { num: 30, den: 1 }
width: 1080
height: 1920
projectSampleRate: 24000
templateRegistryVersion: "1"

safeAreas:
  top: 180        # px, зона интерфейса YouTube Shorts
  bottom: 320
  left: 60
  right: 60

# Дефолтная тишина движка (ADR-0003 T8, находка C4).
# Без этих трёх чисел единственным источником тишины был бы [pause:],
# которого в LLM-драфте не бывает ⇒ ни одного кандидата на разрез ⇒ 1 сегмент на ролик.
# Инвариант корректности: defaultSceneGapSamples > 0.
# 24000 сэмплов/с ⇒ 180 мс = 4320, 320 мс = 7680, 600 мс = 14400.
#
# РЕШЕНИЕ ВЛАДЕЛЬЦА 7 (RM2, 2026-08-22), вариант (в): значения ниже — не кандидаты,
# а принятые величины. ОБЯЗАТЕЛЬНАЯ ЧАСТЬ РЕШЕНИЯ: ПЕРЕСМОТРЕТЬ ПОСЛЕ ПЕРВОГО
# ОПУБЛИКОВАННОГО РОЛИКА. Основание пересмотра — X3 в docs/invariants.md:
# «дефолтные gap'ы звучат естественно» — слуховое свойство, охранника у него нет,
# и корректность от них не зависит (разрез остаётся законным вплоть до 1 сэмпла).
# Без этой записи кандидат стал бы константой молча.
defaultParagraphGapSamples: 4320
defaultSceneGapSamples: 7680
defaultChapterGapSamples: 14400

# Слишком мелкие сегменты — это оверхед старта процесса и Chrome (M10).
# Компилятор объединяет соседние, пока длина меньше порога, и печатает,
# сколько кандидатов на разрез отклонил по этой причине.
#
# РЕШЕНИЕ ВЛАДЕЛЬЦА 7: 45 кадров принято, пересмотр после первого опубликованного ролика.
# FACT (SP-3c §5): полный оверхед на сегмент — 1.86 с (1.12 с до первого кадра + 0.74 с
# хвост) против 3.5 с у Remotion, то есть по скорости порог можно понижать примерно до 30
# кадров без ухудшения AC2. Число выбрано НЕ из скорости, а оставлено прежним до слуховой
# проверки на настоящем ролике — это и есть содержание варианта (в).
minSegmentDurationFrames: 45      # 1.5 с при 30 fps

# ADR-0003 T9: движок сам добавляет к хронометражу Σδ и Σgap,
# а Short длиннее минуты с claimed-музыкой теряет монетизацию (FACT r3 §3.3, PG-E1 BLOCK).
maxDurationFrames: 1800           # 60 с

# Тот же класс величин и то же решение владельца 7: принято как есть,
# пересмотр после первого опубликованного ролика.
captions:
  tokensPerGroupMin: 1
  tokensPerGroupMax: 3
  minGroupDurationFrames: 6       # порог записи в отчёт сборки: группа короче не сдвигается и не растягивается (решение владельца CP-02, ADR-0003 «Субтитры»)
  # Кегль 72 и потолок 21 — ВРЕМЕННЫЕ до TS-01/H-07, измерены по DejaVu Sans Bold
  # (unitsPerEm 2048, xAvgCharWidth 1173 = 0.5728 em): в полосе 1080 − 60 − 60 = 960 px
  # при кегле 72 самая широкая группа фикстуры длиной 21 символ занимает 957 px, длиной
  # 22 символа — 1008 px. Кегль в профиле не живёт: он свойство шаблона (TS-01).
  maxGroupChars: 21
